<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Simplified M icon for favicon -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>

  <!-- Stylized M -->
  <g transform="translate(6, 8)">
    <!-- Left stroke -->
    <rect x="0" y="0" width="3" height="16" rx="1" fill="url(#favGradient)"/>
    <!-- Middle V -->
    <polygon points="3,4 9,0 9,8 3,4" fill="url(#favGradient)"/>
    <polygon points="9,8 15,4 15,12 9,8" fill="url(#favGradient)"/>
    <!-- Right stroke -->
    <rect x="15" y="4" width="3" height="16" rx="1" fill="url(#favGradient)"/>
  </g>

  <!-- Baton accent -->
  <circle cx="24" cy="6" r="2" fill="url(#favGradient)" opacity="0.8"/>
</svg>