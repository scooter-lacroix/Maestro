[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro"
version = "2.0.0"
description = "Unified spec-driven development framework for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Maestro Team"}
]
keywords = ["ai", "development", "framework", "cli", "agent", "memory", "tdd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Core dependencies - required for basic Maestro functionality
core = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

# Memory integration - Unified Memory System (optional)
# This enables all memory features including automatic context extraction
# and semantic search
# Note: If you have PyTorch already installed (ROCm, CUDA, etc.),
# the embeddings service will use it. To install sentence-transformers
# with PyTorch CPU-only, use: uv sync --extra embeddings
memory = [
    "sqlalchemy>=2.0.0",
    "duckdb>=0.9.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "loguru>=0.7.0",
]

# Embeddings support - requires PyTorch
# Use this extra if you don't have PyTorch installed.
# PyTorch will be installed (CPU-only version by default).
# For GPU support, install PyTorch separately first, then use this extra.
embeddings = [
    "sentence-transformers>=2.2.0",
]

# TLDR code analysis
tldr = [
    "ast-tools>=0.1.0",
    "networkx>=3.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pylint>=3.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# All dependencies combined
all = [
    "maestro[core,memory,tldr,dev]",
]

# All dependencies including embeddings (for users without system PyTorch)
all-with-embeddings = [
    "maestro[core,memory,tldr,dev,embeddings]",
]

[project.urls]
Homepage = "https://github.com/scooter-lacroix/Maestro"
Documentation = "https://github.com/scooter-lacroix/Maestro/docs"
Repository = "https://github.com/scooter-lacroix/Maestro"
"Bug Tracker" = "https://github.com/scooter-lacroix/Maestro/issues"

[project.scripts]
maestro = "maestro.cli:main"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.messages_control]
disable = "C0111,W0511"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = [
    "maestro/memory/tests",
    "maestro/core/agents/tests",
    "maestro/core/tracks/tests",
    "maestro/skills/tests",
    "maestro/critical_think/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test*"
asyncio_mode = "auto"
addopts = [
    "--cov=maestro",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=98",
]

[tool.coverage.run]
source = ["maestro"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
