[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-framework"
version = "2.0.0"
description = "Spec-driven development framework for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Maestro Team"}
]
keywords = ["ai", "development", "framework", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
# Core dependencies - required for basic Maestro functionality
core = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "toml>=0.10.2",
]

# Memory integration - Nexus Memory System (optional)
# This enables all memory features including automatic context extraction
# and semantic search
memory = [
    # Nexus Memory System dependencies
    "sqlalchemy>=2.0.0",
    "sentence-transformers>=2.2.0",
    "sqlite-vec>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pylint>=3.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# All dependencies combined
all = [
    "maestro-framework[core,memory,dev]",
]

[project.urls]
Homepage = "https://github.com/scooter-lacroix/Maestro"
Documentation = "https://github.com/scooter-lacroix/Maestro/docs"
Repository = "https://github.com/scooter-lacroix/Maestro"
"Bug Tracker" = "https://github.com/scooter-lacroix/Maestro/issues"

[project.scripts]
maestro = "maestro.cli:main"

[tool.setuptools]
packages = ["maestro"]

[tool.setuptools.package-data]
"maestro" = ["templates/*", "templates/**/*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.messages_control]
disable = "C0111,W0511"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["maestro/memory/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test*"
asyncio_mode = "auto"
addopts = [
    "--cov=maestro/memory",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=98",
]

[tool.coverage.run]
source = ["maestro/memory"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
