[package]
name = "leindex-core"
version = "2.5.0"
edition = "2021"
description = "LeIndex Core - Code analyzers, memory service, and vector search"
authors = ["Maestro Project"]

[features]
default = ["rusqlite"]
# Enable rusqlite for legacy memory service and migration support
# Disable with --no-default-features for pure libsql/turso backend
rusqlite = ["dep:rusqlite"]

[lib]
name = "leindex_core"
crate-type = ["rlib"]

[[bin]]
name = "maestro-setup"
path = "bin/setup_main.rs"

[[bin]]
name = "leindex-benchmark-report"
path = "src/cli/vector_benchmark.rs"

[[bin]]
name = "leindex-simple-bench"
path = "src/bench/simple_bench.rs"

[[bin]]
name = "leindex-granular-bench"
path = "src/bench/granular_bench.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework for API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Database
rusqlite = { version = "0.32", optional = true }  # TEMP: Keep for migration support (feature: rusqlite) - no bundled to avoid conflicts with libsql
libsql = "0.9"  # Turso/libSQL unified database backend

# HTTP client (for Zoekt)
reqwest = { version = "0.12", features = ["json"], default-features = false }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Graph algorithms
petgraph = "0.6"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrency
rayon = "1.8"
dashmap = "5.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tree-sitter for multi-language parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
libc = "0.2"
walkdir = "2"
regex = "1"
tempfile = "3.8"  # Secure temporary file creation for atomic writes
base64 = "0.22"  # For libsql vector extension encoding

# Full-text search (preserves existing Tantivy capability)
tantivy = "0.22"
sha2 = "0.10.9"
uuid = { version = "1.19.0", features = ["v4"] }

# Vector search (HNSW implementation)
hnswx = "0.2.5"
wide = "1.1"  # SIMD-accelerated cosine similarity

# LSP support for on-demand language server integration
lsp-types = "0.97"  # LSP protocol types
urlencoding = "2.1"  # URL encoding for file:// URIs
# tokio already has "full" features which includes process::Command for LSP spawning

# Database migrations
async-trait = "0.1"  # Async trait support for migration framework

[[bench]]
name = "vector_benchmark"
harness = false

[dev-dependencies]
# Benchmarking
criterion = "0.5"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
