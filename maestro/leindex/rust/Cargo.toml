[package]
name = "leindex-analyzers"
version = "2.0.0"
edition = "2021"
description = "High-performance code analyzers for LeIndex - Pure Rust"
authors = ["Maestro Project"]

[lib]
name = "leindex_analyzers"
crate-type = ["rlib"]

[[bin]]
name = "maestro"
path = "src/main.rs"

[[bin]]
name = "maestro-setup"
path = "src/setup_main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework for API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }  # TEMP: Keep for migration support
libsql = "0.9"  # Turso/libSQL unified database backend

# HTTP client (for Zoekt)
reqwest = { version = "0.12", features = ["json"], default-features = false }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Graph algorithms
petgraph = "0.6"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrency
rayon = "1.8"
dashmap = "5.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tree-sitter for multi-language parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
regex = "1"

# Full-text search (preserves existing Tantivy capability)
tantivy = "0.22"
sha2 = "0.10.9"
uuid = { version = "1.19.0", features = ["v4"] }

# LSP support for on-demand language server integration
lsp-types = "0.97"  # LSP protocol types
# tokio already has "full" features which includes process::Command for LSP spawning

# Database migrations
async-trait = "0.1"  # Async trait support for migration framework

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
