<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro Memory Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 60px;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #666;
            font-weight: 500;
        }

        .status-value {
            color: #333;
            font-weight: 700;
        }

        .links {
            margin-top: 30px;
        }

        .links a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .links a:hover {
            background: #5568d3;
        }

        .links a.secondary {
            background: #e9ecef;
            color: #333;
        }

        .links a.secondary:hover {
            background: #dde2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Maestro Memory Dashboard</h1>
        <p class="subtitle">Unified Development Framework Memory System</p>

        <div class="loading"></div>

        <div class="status" id="status">
            <div class="status-item">
                <span class="status-label">Status</span>
                <span class="status-value">Loading...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Version</span>
                <span class="status-value">2.0.0</span>
            </div>
        </div>

        <div class="links">
            <a href="/api/docs">API Documentation</a>
            <a href="/api/v1/projects" class="secondary">Projects</a>
            <a href="/api/v1/tracks" class="secondary">Tracks</a>
            <a href="/api/v1/stats" class="secondary">Statistics</a>
        </div>
    </div>

    <script>
        // Fetch and display status
        fetch('/health')
            .then(r => r.json())
            .then(data => {
                document.querySelector('.status-item:first-child .status-value').textContent = data.status;
                document.querySelector('.loading').style.display = 'none';
            })
            .catch(err => {
                document.querySelector('.status-item:first-child .status-value').textContent = 'Error';
                document.querySelector('.loading').style.display = 'none';
            });

        // Fetch stats
        fetch('/api/v1/stats')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const statusDiv = document.getElementById('status');
                    statusDiv.innerHTML = `
                        <div class="status-item">
                            <span class="status-label">Total Memories</span>
                            <span class="status-value">${data.total_memories}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Total Projects</span>
                            <span class="status-value">${data.total_projects}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Total Tracks</span>
                            <span class="status-value">${data.total_tracks}</span>
                        </div>
                    `;
                }
            })
            .catch(err => console.error('Failed to fetch stats:', err));
    </script>
</body>
</html>
