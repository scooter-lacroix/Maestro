[package]
name = "maestro-integration"
version = "0.1.0"
edition = "2021"
description = "Maestro integration layer for tab-rs terminal multiplexer"
authors = ["Maestro Project"]

[dependencies]
# Local tab-rs dependencies
tab-api = { path = "../common/tab-api" }
tab-websocket = { path = "../common/tab-websocket" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# WebSocket - must match tab-websocket versions
tungstenite = { version = "0.15", default-features = false }
async-tungstenite = { version = "0.15", features = ["tokio-runtime"] }

# Serialization
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utilities
dashmap = "5.5"
