[package]
name = "maestro-cockpit"
version = "2.5.0"
edition = "2021"
description = "Maestro Cockpit v2 - Ratatui Terminal UI"
authors = ["Maestro Project"]

[lib]
name = "maestro_cockpit"
crate-type = ["rlib"]

[[bin]]
name = "maestro-cockpit"
path = "src/main.rs"

[dependencies]
# Core library (shared data layer)
leindex-core = { path = "../../src/leindex" }

# Maestro core capabilities (Phase 3)
maestro-core = { path = "../core" }

# Pi-Mono agent integration
maestro-pi-mono = { path = "../pi-mono" }

# Cancellation token support (CancellationToken is in default)
tokio-util = "0.7"

# Ktop collectors for system metrics
ktop_collectors = { path = "../ktop_collectors" }

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
lazy_static = "1.4"
which = "6.0"
cli-clipboard = "0.4"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
