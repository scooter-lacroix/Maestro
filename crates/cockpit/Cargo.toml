[package]
name = "maestro-cockpit"
version = "2.5.0"
edition = "2021"
description = "Maestro Cockpit v2 - Ratatui Terminal UI"
authors = ["Maestro Project"]

[lib]
name = "maestro_cockpit"
crate-type = ["rlib"]

[[bin]]
name = "maestro-cockpit"
path = "src/main.rs"

[dependencies]
# Core library (shared data layer)
leindex-core = { path = "../../src/leindex" }

# Maestro core capabilities (Phase 3)
maestro-core = { path = "../core" }

# Maestro Claw agent framework
maestro-claw = { path = "../maestro-claw" }

# Pi-Mono agent integration
maestro-pi-mono = { path = "../pi-mono" }

# Cancellation token support (CancellationToken is in default)
tokio-util = "0.7"

# Ktop collectors for system metrics
ktop_collectors = { path = "../ktop_collectors" }

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
lazy_static = "1.4"
which = "6.0"
# NOTE: cli-clipboard 0.4.0 depends on wl-clipboard-rs 0.7.0 which has a Rust
# future incompatibility warning. This cannot be resolved until cli-clipboard
# publishes a new version that depends on wl-clipboard-rs 0.8+.
# See: https://github.com/actuallyallie/cli-clipboard/issues
# Blocked by: upstream cli-clipboard dependency on wl-clipboard-rs ^0.7.0
cli-clipboard = "0.4"
dirs = "5.0"
libc = "0.2"
portable-pty = "0.8"

[dev-dependencies]
serial_test = "3"
tempfile = "3.10"
