[package]
name = "maestro-cockpit"
version = "2.5.0"
edition = "2021"
description = "Maestro Cockpit v2 - Ratatui Terminal UI"
authors = ["Maestro Project"]

[lib]
name = "maestro_cockpit"
crate-type = ["rlib"]

[dependencies]
# Core library (shared data layer)
leindex-core = { path = "../../maestro/leindex/rust" }

# Ktop collectors for system metrics
ktop_collectors = { path = "../ktop_collectors" }

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
lazy_static = "1.4"
which = "6.0"
cli-clipboard = "0.4"

[dev-dependencies]
tempfile = "3.10"
