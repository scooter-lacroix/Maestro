[package]
name = "maestro-lsp-mcp-bridge"
version = "2.5.0"
edition = "2021"
description = "Maestro LSP to MCP Bridge - Protocol translation"
authors = ["Maestro Project"]

[[bin]]
name = "maestro-lsp-mcp-bridge"
path = "src/main.rs"

[dependencies]
# Core library
leindex-core = { path = "../../maestro/leindex/rust" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# LSP types
lsp-types = "0.97"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
