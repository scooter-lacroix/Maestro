[workspace]
members = [
    "maestro/leindex/rust",
    "crates/cockpit",
    "crates/cli",
    "crates/pi-mono",
]
resolver = "2"

[workspace.package]
version = "2.5.0"
edition = "2021"
authors = ["Maestro Project"]

[workspace.dependencies]
# Shared dependencies for all workspace members
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
