[workspace]
members = [
    "src/leindex",
    "crates/cockpit",
    "crates/cli",
    "crates/lsp-bridge",
    "crates/pi-mono",
    "crates/ktop_collectors",
    "crates/core",
    "crates/gateway",
    # maestro-tab: Forked tab-rs terminal multiplexer
    "src/maestro-tab/tab",
    "src/maestro-tab/tab-command",
    "src/maestro-tab/tab-daemon",
    "src/maestro-tab/tab-pty",
    "src/maestro-tab/common/tab-api",
    "src/maestro-tab/common/tab-websocket",
    "src/maestro-tab/maestro-integration",
]
resolver = "2"

[workspace.package]
version = "2.5.0"
edition = "2021"
authors = ["Maestro Project"]

[workspace.dependencies]
# Shared dependencies for all workspace members
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
libsql = { path = "vendor/libsql" }

# Use local maestro-tab fork instead of crates.io
tab-api = { path = "src/maestro-tab/common/tab-api" }
tab-websocket = { path = "src/maestro-tab/common/tab-websocket" }
tab-command = { path = "src/maestro-tab/tab-command" }
tab-daemon = { path = "src/maestro-tab/tab-daemon" }
tab-pty = { path = "src/maestro-tab/tab-pty" }
